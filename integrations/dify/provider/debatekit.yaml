identity:
  author: deadpixel
  name: debatekit
  label:
    en_US: DebateKit
  description:
    en_US: Multi-model AI debate platform
  icon: icon.svg
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: API Key
    placeholder:
      en_US: rpnd_xxxxxxxxxxxx
    help:
      en_US: Generate at debatekit.ai/chat/settings/api-keys
    url: https://debatekit.ai/chat/settings/api-keys
  base_url:
    type: text-input
    required: false
    label:
      en_US: API Base URL
    placeholder:
      en_US: https://mcp.debatekit.ai
    help:
      en_US: Override the default API endpoint (advanced). Leave empty for default.
