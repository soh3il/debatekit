# Deploy to PREVIEW — every push to a non-main branch.
#
# Deploys all 6 workers to their `preview` Cloudflare env via the existing
# per-workspace `deploy:preview` scripts (which all call `wrangler deploy
# --env=preview --keep-vars`, except apps/web — see flag at bottom).
#
# Secrets required:
#   - CLOUDFLARE_API_TOKEN   — Cloudflare API token with Workers/D1/R2/KV/Pages
#                              Edit + Account Settings Read scopes. Create at
#                              https://dash.cloudflare.com/profile/api-tokens
#   - CLOUDFLARE_ACCOUNT_ID  — `c21c4d074e34a8b1b9d335a41c2f69e3` (Soheil's).
#                              Already baked into every wrangler.jsonc; kept as
#                              belt-and-suspenders so `wrangler` picks it up
#                              even if someone removes `account_id` later.
#
# No app-level secrets here. Those are uploaded out-of-band via
# `scripts/bootstrap-cf-secrets.sh` and `--keep-vars` preserves them on deploy.

name: Deploy (preview)

on:
  push:
    branches:
      - preview
  workflow_dispatch:

concurrency:
  group: deploy-preview
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-preview:
    name: deploy ${{ matrix.workspace }} (preview)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.actor != 'dependabot[bot]'

    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: apps/api
            name: api
          - workspace: apps/web
            name: web
          - workspace: apps/mcp
            name: mcp
          - workspace: integrations/slack
            name: slack
          - workspace: integrations/telegram
            name: telegram
          - workspace: integrations/whatsapp
            name: whatsapp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-deploy-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-deploy-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy ${{ matrix.name }} to preview
        working-directory: ${{ matrix.workspace }}
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        shell: bash
        run: |
          set -euo pipefail
          bun run deploy:preview

      - name: Job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Preview deploy: ${{ matrix.name }} — ${{ job.status }}"
            echo ""
            echo "- Workspace: \`${{ matrix.workspace }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Secrets: \`CLOUDFLARE_API_TOKEN\`, \`CLOUDFLARE_ACCOUNT_ID\`"
            echo "- Cloudflare dashboard: https://dash.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/services"
          } >> "$GITHUB_STEP_SUMMARY"
