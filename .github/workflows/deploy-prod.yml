# Deploy to PRODUCTION — push to main, or manual dispatch.
#
# Deploys all 6 workers to their `production` Cloudflare env via the existing
# per-workspace `deploy:production` scripts. Concurrency guarded so two pushes
# never race; cancel-in-progress is FALSE to avoid killing a partial deploy
# mid-flight.
#
# Secrets required:
#   - CLOUDFLARE_API_TOKEN   — Cloudflare API token with Workers/D1/R2/KV/Pages
#                              Edit + Account Settings Read scopes. Create at
#                              https://dash.cloudflare.com/profile/api-tokens
#   - CLOUDFLARE_ACCOUNT_ID  — `67bc7b518b92a0c406ac9b8526ddbb6d` (Soheil's).
#                              Already baked into every wrangler.jsonc; kept as
#                              belt-and-suspenders.
#
# No app-level secrets here — those are uploaded via
# `scripts/bootstrap-cf-secrets.sh` and `--keep-vars` preserves them.

name: Deploy (production)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-prod" to confirm production deployment'
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  guard:
    name: pre-deploy guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify manual confirmation
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "deploy-prod" ]; then
            echo "::error::Manual dispatch requires confirm input == 'deploy-prod' (got: '${{ inputs.confirm }}')"
            exit 1
          fi
          echo "Manual confirmation OK."

  deploy-production:
    name: deploy ${{ matrix.workspace }} (production)
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # protected environment — configure required reviewers in repo settings →
    # Environments → "production" if you want an approval gate.
    environment: production

    strategy:
      # Order matters less than you might think (each worker is independent),
      # but a single failure should not block the rest from trying.
      fail-fast: false
      matrix:
        include:
          - workspace: apps/api
            name: api
          - workspace: apps/web
            name: web
          - workspace: apps/mcp
            name: mcp
          - workspace: integrations/slack
            name: slack
          - workspace: integrations/telegram
            name: telegram
          - workspace: integrations/whatsapp
            name: whatsapp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-deploy-prod-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-deploy-prod-
            ${{ runner.os }}-turbo-deploy-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy ${{ matrix.name }} to production
        working-directory: ${{ matrix.workspace }}
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        shell: bash
        run: |
          set -euo pipefail
          bun run deploy:production

      - name: Job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Production deploy: ${{ matrix.name }} — ${{ job.status }}"
            echo ""
            echo "- Workspace: \`${{ matrix.workspace }}\`"
            echo "- Ref: \`${{ github.ref }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Triggered by: \`${{ github.event_name }}\` (actor: \`${{ github.actor }}\`)"
            echo "- Secrets: \`CLOUDFLARE_API_TOKEN\`, \`CLOUDFLARE_ACCOUNT_ID\`"
            echo "- Cloudflare dashboard: https://dash.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/services"
          } >> "$GITHUB_STEP_SUMMARY"
