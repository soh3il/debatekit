# D1 migrations — manual dispatch only.
#
# Runs `wrangler d1 migrations apply DB --remote --env=<env>` for apps/api,
# which is the only worker that owns the D1 schema (apps/mcp shares the same
# binding read-only).
#
# Secrets required:
#   - CLOUDFLARE_API_TOKEN   — Cloudflare API token with D1 Edit + Account
#                              Settings Read. Same token as deploy workflows.
#   - CLOUDFLARE_ACCOUNT_ID  — `67bc7b518b92a0c406ac9b8526ddbb6d` (Soheil's).
#                              Already baked into apps/api/wrangler.jsonc;
#                              kept here as belt-and-suspenders.
#
# Trigger: workflow_dispatch only. Requires typing the target env in `confirm`
# so a stray click cannot wipe production.

name: D1 migrate (manual)

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - preview
          - prod
      confirm:
        description: 'Retype the target env above to confirm (preview|prod)'
        required: true
        type: string

concurrency:
  # One migration at a time per env. Never cancel a migration in flight.
  group: db-migrate-${{ inputs.env }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  migrate:
    name: d1 migrate (${{ inputs.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `prod` runs in the protected `production` environment — configure
    # required reviewers in repo settings → Environments → "production".
    environment: ${{ inputs.env == 'prod' && 'production' || 'preview' }}

    steps:
      - name: Confirm env matches
        shell: bash
        run: |
          set -euo pipefail
          echo "Requested env:  ${{ inputs.env }}"
          echo "Confirm input:  ${{ inputs.confirm }}"
          if [ "${{ inputs.env }}" != "${{ inputs.confirm }}" ]; then
            echo "::error::confirm ('${{ inputs.confirm }}') does not match env ('${{ inputs.env }}'). Aborting."
            exit 1
          fi
          echo ""
          echo "This will run migrations against ${{ inputs.env }}, continuing..."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply D1 migrations to ${{ inputs.env }}
        working-directory: apps/api
        shell: bash
        # Maps preview→preview, prod→prod here; both `db:migrate:preview` and
        # `db:migrate:prod` resolve to wrangler env names `preview` and
        # `production` respectively (see apps/api/package.json).
        run: |
          set -euo pipefail
          if [ "${{ inputs.env }}" = "prod" ]; then
            bun run db:migrate:prod
          else
            bun run db:migrate:preview
          fi

      - name: Job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### D1 migrate — ${{ job.status }}"
            echo ""
            echo "- Target env: \`${{ inputs.env }}\` (wrangler env: \`${{ inputs.env == 'prod' && 'production' || 'preview' }}\`)"
            echo "- Workspace: \`apps/api\`"
            echo "- Binding: \`DB\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Actor: \`${{ github.actor }}\`"
            echo "- Secrets: \`CLOUDFLARE_API_TOKEN\`, \`CLOUDFLARE_ACCOUNT_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
