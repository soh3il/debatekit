# CI — typecheck, lint, build on every PR and push to main.
#
# Secrets required: none. (Build runs without secrets; runtime secrets live in
# Cloudflare via `wrangler secret put`, not in CI. Workers compile fine without
# them — bindings resolve at deploy time, not build time.)
#
# Triggered by: pull_request (any branch), push to main.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  ci:
    name: typecheck + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        env:
          # apps/web's TS graph is heavy; mirror the apps/web package script.
          NODE_OPTIONS: --max-old-space-size=8192
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: bun run build

      - name: Job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### CI result: ${{ job.status }}"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Ref: \`${{ github.ref }}\`"
            echo "- Secrets used: _none_ (build does not need Cloudflare secrets)"
          } >> "$GITHUB_STEP_SUMMARY"
